<head>

    <!-- PDF Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- A simple, clean CSS framework for styling -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
    <style>
        #order-form-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
        }

        :root {
            --color-dark-blue: #003359;
            --color-bright-blue: #009FE3;
            --color-light-blue-bg: #e6f2ff;
            --color-text-dark: #333333;
            --color-text-light: #ffffff;
            --color-bg-light: #f9f9f9;
            --color-border: #ccc;
            --color-header-bg: #f2f2f2;
            --color-success: #28a745;
            --color-danger: #dc3545;
            --color-danger-bg: #ffcccc;
        }

        body {
            color: var(--color-text-dark);
        }

        #order-form-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 5px;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            background-color: var(--color-bg-light);
        }

        .tab-nav {
            display: flex;
            border-bottom: 1px solid #ccc;
            border-bottom: 1px solid var(--color-border);
            margin-bottom: 2px;
        }

        .tab-nav button {
            padding: 3px 10px;
            cursor: pointer;
            border: 1px solid transparent;
            border-bottom: none;
            background-color: #eee;
            background-color: var(--color-header-bg);
            color: var(--color-bright-blue);
            margin-right: 5px;
        }

        .tab-nav button.active {
            background-color: #f9f9f9;
            border-color: #ccc;
            background-color: var(--color-bg-light);
            background-color: var(--color-bg-light);
            /* Match tab content background */
            border-color: var(--color-border);
            color: var(--color-dark-blue);
            border-bottom: 1px solid #f9f9f9;
            margin-bottom: -1px;
        }

        .settings-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 3px 13px;
            /* Widen settings tab button */
        }

        .table-container {
            overflow: auto;
            /* Enable both horizontal and vertical scrolling */
            max-height: 60vh;
            /* Set a maximum height before scrolling starts */
        }

        table {
            border-collapse: collapse;
            table-layout: auto;
        }

        /* Removed width: 100% and added table-layout: auto */
        th,
        td {
            padding: 4px 6px;
            border: 1px solid #ddd;
            text-align: left;
            font-size: 0.64rem;
            white-space: nowrap;
            overflow: hidden;
        }

        thead {
            background-color: #f2f2f2;
        }

        th,
        td {
            padding: 4px 6px;
            border: 1px solid var(--color-border);
            text-align: left;
            font-size: 0.64rem;
            white-space: nowrap;
            overflow: hidden;
        }

        thead {
            background-color: var(--color-header-bg);
        }

        .loading,
        .error {
            text-align: center;
            padding: 2rem;
        }

        .col-wide {
            min-width: 250px;
            /* Make the description column wider */
            white-space: normal;
            /* Allow text wrapping only for this column */
        }

        .col-narrow {
            max-width: 80px;
            /* Encourage narrow columns to be smaller */
        }

        th {
            position: sticky;
            top: 0;
        }

        .tab-content-config {
            background-color: #fff5e6;
            /* A very light orange */
            background-color: var(--color-light-blue-bg);
            padding: 1rem 1px 1px 1rem;
            /* top, right, bottom, left */
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            height: 500px;
            /* Example height, adjust as needed */
            overflow-y: auto;
            padding-right: 1rem;
            /* Add padding to the right to account for the scrollbar */
        }

        .form-group {
            margin-bottom: 0.6rem;
            /* Reduced vertical spacing by 60% */
        }

        .price-column {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0;
        }

        .price-header-row {
            display: flex;
            gap: 0.5rem;
            padding-right: 0;
            /* Align with price boxes */
        }

        .price-columns-container {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            justify-content: flex-end;
            /* Align prices to the right */
        }

        .actions-bar {
            display: flex;
            justify-content: space-around;
            /* Distribute buttons evenly */
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            /* Space below the bar */
        }

        .top-section .form-group {
            /* Add padding to the right to account for the scrollbar in the bottom section */
            padding-right: 17px;
        }

        .clear-button {
            padding: 2px 3px;
        }

        .submit-button {
            background-color: green;
            color: white;
            border-color: darkgreen;
            background-color: var(--color-success);
            color: var(--color-text-light);
            border-color: var(--color-success);
        }

        .invalid-submit {
            background-color: #ffcccc;
            /* Pale red */
            background-color: var(--color-danger-bg);
            /* Pale red */
            color: #333;
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .form-row> :first-child {
            flex-grow: 1;
            /* Allow the control (select/label) to take up available space */
            flex-shrink: 1;
        }

        .price-display {
            text-align: right;
            padding-top: 5px;
            /* Reduced height by ~20% */
            padding-bottom: 5px;
            /* Reduced height by ~20% */
            width: 9ch;
            /* Set width to roughly 9 characters */
            font-size: 0.8rem;
            /* Reduce text size by 20% */
        }

        .notes-display {
            background-color: #e6f2ff;
            /* Light Blue */
            background-color: var(--color-light-blue-bg);
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 1rem;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }

        .notes-text {
            width: 200px;
            height: 150px;
            overflow-y: auto;
            font-size: 0.85rem;
        }

        .notes-image {
            max-width: 100%;
            height: auto;
            max-height: 150px;
        }

        select:required:invalid {
            color: #666;
            /* Make placeholder text visible */
            border: 1px solid red;
            /* Add red border to unselected required fields */
            border: 1px solid var(--color-danger);
            /* Add red border to unselected required fields */
        }

        .total-price-display {
            color: blue;
            color: var(--color-bright-blue);
        }

        .compact-price-box {
            padding-top: 1px !important;
            /* Use !important to override .price-display */
            padding-bottom: 1px !important;
        }

        .custom-multiselect {
            position: relative;
            width: 200px;
        }

        .multiselect-display {
            border: 1px solid #ccc;
            border: 1px solid var(--color-border);
            padding: 5px 10px;
            cursor: pointer;
            background-color: white;
            border-radius: 4px;
            font-size: 0.7rem;
            /* Reduced font size by 30% */
        }

        .multiselect-options {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            border: 1px solid #ccc;
            border: 1px solid var(--color-border);
            border-top: none;
            background-color: white;
            z-index: 1000;
            max-height: 200px;
            overflow-y: auto;
        }

        .selected-items-container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            padding: 5px;
        }

        .selected-item-tag {
            background-color: #e0e0e0;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: move;
            font-size: 0.8rem;
            border: 1px solid #ccc;
            border: 1px solid var(--color-border);
        }

        .drag-over {
            background-color: #3498db;
            color: white;
            background-color: var(--color-bright-blue);
            color: var(--color-text-light);
        }
    </style>
</head>

<body>

    <div id="order-form-container">
        <!-- The Vue.js application will be mounted here -->
        <!-- The template for our app is now defined below, outside the main script block -->
    </div>

    <!-- 1. Include Vue.js library -->
    <script src="https://unpkg.com/vue@3"></script>

    <!-- 
      TEMPLATE DEFINITION 
      This script block defines the HTML structure of our component.
      By separating it, we make both the template and the logic easier to read.
    -->
    <script type="text/x-template" id="order-form-template">
        <h2 style="text-align: center; margin-top: 4px; margin-bottom: 4px;">Shower Commode</h2>
        <!-- Tab Navigation -->
        <div class="tab-nav">
            <a href="index.html" title="Home" style="color: var(--text-main); margin-right: 10px; margin-bottom: 3px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24" fill="var(--color-bright-blue)"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8h5z"/></svg>
            </a>
            <button @click="activeTab = 'configuration'" :class="{ active: activeTab === 'configuration' }">Build</button>
            <button @click="activeTab = 'person'" :class="{ active: activeTab === 'person' }">Order Details</button>
            <button @click="activeTab = 'table'" :class="{ active: activeTab === 'table' }">Item List</button>
            <button @click="activeTab = 'summary'" :class="{ active: activeTab === 'summary' }">Summary</button>
            <button v-if="isLoggedIn" @click="activeTab = 'my-builds'" :class="{ active: activeTab === 'my-builds' }">My Builds</button>
            <button @click="activeTab = 'settings'" :class="['settings-button', { active: activeTab === 'settings' }]" title="Settings"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="var(--color-bright-blue)" viewBox="0 0 16 16"><path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311a1.464 1.464 0 0 1-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c-1.4-.413-1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872l-.1-.34zM8 10.93a2.929 2.929 0 1 1 0-5.858 2.929 2.929 0 0 1 0 5.858z"/></svg></button>
        </div>


        <!-- Tab Content -->
        <div v-show="activeTab === 'configuration'" class="tab-content-config">
            <div v-if="isLoading" class="loading">Loading Build...</div>
            <form v-else-if="!error" style="display: flex; flex-direction: column; height: 100%;">
                <!-- Combined Section -->
                    <!-- Buttons and Defaults Section -->
                    <div v-if="selectedBase" class="actions-bar">
                        <label>
                            <input type="checkbox" v-model="selectDefaults"> Select Defaults
                        </label>
                        <button @click.prevent="clearConfiguration" type="button" class="clear-button">
                            Clear
                        </button>
                        <button @click.prevent="saveConfiguration" type="button" class="clear-button" title="Login required">
                            Save
                        </button>
                        <button @click.prevent="loadConfiguration" type="button" class="clear-button" title="Login required">
                            Load
                        </button>
                        <button @click.prevent="submitConfiguration" type="button" class="clear-button submit-button" :class="{ 'invalid-submit': isFormInvalid }">
                            Submit
                        </button>
                    </div>

                    <!-- Base Product Selection -->
                    <div class="form-group">
                        <div class="form-row" @mouseenter="hoveredControlId = 'base-product'" @mouseleave="hoveredControlId = null" style="align-items: center;">
                            <div style="flex-grow: 1;">
                                <select id="base-product" v-model="selectedBaseId" required style="width: 100%;">
                                    <option disabled value="">Base</option>
                                    <option v-for="product in baseProducts" :key="product.ID" :value="product.ID">
                                    {{ product.ITEM === product.DESCRIPTION ? product.ITEM : product.ITEM + ' ' + product.DESCRIPTION }} <span v-if="parseFloat(product[primaryPriceField]) > 0">{{ currencySymbol }}{{ product[primaryPriceField] }}</span>
                                    </option>
                                </select>
                            </div>
                            <div class="price-column" style="min-width: 29ch;">
                                <div style="display: flex; align-items: center; gap: 0.5rem;">
                                    <label style="font-size: 0.85rem; opacity: 0.05;">ListHeader:</label>
                                    <template v-for="header in selectedPriceHeaders" :key="header">
                                        <input type="text" readonly class="price-display compact-price-box" :value="header" style="text-align: center;">
                                    </template>
                                </div>
                                <div style="display: flex; align-items: center; gap: 0.5rem;">
                                    <label style="font-size: 0.85rem;">Total:</label>
                                    <template v-for="header in selectedPriceHeaders" :key="header">
                                        <input type="text" readonly class="price-display total-price-display compact-price-box" :value="currencySymbol + getHeaderTotal(header)">
                                    </template>
                                </div>
                                <div v-if="selectedBase" style="display: flex; align-items: center; gap: 0.5rem;">
                                    <label style="font-size: 0.85rem; color: #888;">Base:</label>
                                    <template v-for="header in selectedPriceHeaders" :key="header">
                                        <input type="text" readonly class="price-display compact-price-box" :value="getDataRow(selectedBase, header) > 0 ? currencySymbol + getDataRow(selectedBase, header) : ''">
                                    </template>
                                </div>
                                <div v-if="selectedPriceHeaders.some(h => h.toLowerCase() === 'cost')" style="display: flex; align-items: center; gap: 0.5rem;">
                                    <label style="font-size: 0.85rem; color: #888;">Margin:</label>
                                    <template v-for="header in selectedPriceHeaders" :key="header">
                                        <input v-if="header.toLowerCase() !== 'cost'"
                                               type="text"
                                               readonly
                                               class="price-display compact-price-box"
                                               @click="toggleMarginDisplay(header)"
                                               :value="marginDisplayState[header] === 'percentage' ? getMarginPercentage(header) : currencySymbol + getMargin(header)"
                                               style="cursor: pointer;"
                                               :title="'Click to toggle Margin % / $'">
                                        <input v-else type="text" readonly class="price-display compact-price-box" value="">
                                    </template>
                                </div>
                            </div>
                        </div>
                        <div v-if="hoveredControlId === 'base-product' && selectedBase && (selectedBase.Notes || selectedBase.Link)" class="notes-display">
                            <div v-if="selectedBase.Notes" class="notes-text">
                                {{ selectedBase.Notes }}
                            </div>
                            <img v-if="selectedBase.Link" :src="selectedBase.Link" class="notes-image" alt="Note Image">
                        </div>
                    </div>
                    <!-- Dynamically Rendered Conditional Controls -->
                    <div v-if="selectedBase" >
                        <div v-for="control in conditionalControls" :key="control.id" class="form-group">
                            <div class="form-row">
                            <!-- Left Side: Control -->
                            <div style="flex-grow: 1;">
                                <select v-if="control.controlType === 'DDR'" :id="control.id" v-model="formSelections[control.id]" required @mouseenter="hoveredControlId = control.id" @mouseleave="hoveredControlId = null" style="width: 100%;">
                                    <option disabled value="">{{ control.label }}</option>
                                    <option v-for="option in control.options" :key="option.ID" :value="option.ID">{{ option.ITEM === option.DESCRIPTION ? option.ITEM : option.ITEM + ' ' + option.DESCRIPTION }} <span v-if="parseFloat(option[priceField]) > 0">{{ currencySymbol }}{{ option[priceField] }}</span></option>
                                </select>
                                <select v-if="control.controlType === 'DD'" :id="control.id" v-model="formSelections[control.id]" @mouseenter="hoveredControlId = control.id" @mouseleave="hoveredControlId = null" :required="control.section === 'Pattern' && isPatternRequired" style="width: 100%;">
                                    <option :value="undefined">{{ control.label }}</option>
                                    <option v-for="option in control.options" :key="option.ID" :value="option.ID">{{ option.ITEM === option.DESCRIPTION ? option.ITEM : option.ITEM + ' ' + option.DESCRIPTION }} <span v-if="parseFloat(option[priceField]) > 0">{{ currencySymbol }}{{ option[priceField] }}</span></option>
                                </select>
                                <label v-if="control.controlType === 'CB' || control.controlType === 'CBR'" :for="control.id" @mouseenter="hoveredControlId = control.id" @mouseleave="hoveredControlId = null">
                                    <input type="checkbox" :id="control.id" v-model="formSelections[control.id]" :disabled="isCheckboxDisabled(control.id)">
                                    {{ control.label }} <span v-if="parseFloat(control.price) > 0">{{ currencySymbol }}{{ control.price }}</span>
                                </label>
                            </div>
                            <!-- Right Side: Prices -->
                            <div class="price-columns-container" v-if="shouldShowPrice(control)">
                                <template v-for="header in selectedPriceHeaders" :key="header">
                                    <!-- Price for Dropdowns -->
                                    <input v-if="(control.controlType === 'DDR' || control.controlType === 'DD') && selectedOptions[control.id]" type="text" readonly class="price-display" :value="getDataRow(selectedOptions[control.id], header) > 0 ? currencySymbol + getDataRow(selectedOptions[control.id], header) : ''" :style="{ color: header === 'Off Unit' ? 'blue' : '' }">
                                    <!-- Price for Checkboxes -->
                                    <input v-if="(control.controlType === 'CB' || control.controlType === 'CBR') && formSelections[control.id]" type="text" readonly class="price-display" :value="getCheckboxPrice(control, header) > 0 ? currencySymbol + getCheckboxPrice(control, header) : ''" :style="{ color: header === 'Off Unit' ? 'blue' : '' }">
                                </template>
                            </div>
                        </div>
                        <div v-if="hoveredControlId === control.id && selectedOptions[control.id] && (selectedOptions[control.id].Notes || selectedOptions[control.id].Link)" class="notes-display">
                            <div v-if="selectedOptions[control.id].Notes" class="notes-text">{{ selectedOptions[control.id].Notes }}</div>
                            <img v-if="selectedOptions[control.id].Link" :src="selectedOptions[control.id].Link" class="notes-image" alt="Note Image">
                        </div>
                        </div>
                    </div>
                </div> <!-- Closing div for v-if="selectedBase" -->
            </form>
            <div v-else class="error">{{ error }}</div>
        </div>

        <div v-show="activeTab === 'person'">
            <h2>Order Details</h2>
            <!-- Content for this tab has been removed -->
            <div style="display: flex; gap: 2rem;">
                <div style="flex: 1;">
                    <div class="form-group">
                        <label for="po-number">Purchase Order #</label>
                        <input type="text" id="po-number">
                    </div>
                    <div class="form-group">
                        <label for="quote-number">Quote #</label>
                        <input type="text" id="quote-number">
                    </div>
                    <div class="form-group">
                        <label for="account-number">Account #</label>
                        <input type="text" id="account-number">
                    </div>
                    <div class="form-group">
                        <label for="ordered-by">Ordered By:</label>
                        <input type="text" id="ordered-by">
                    </div>
                    <div class="form-group">
                        <label for="supplier-company">Supplier Company:</label>
                        <input type="text" id="supplier-company">
                    </div>
                    <div class="form-group">
                        <label for="supplier-address">Address:</label>
                        <textarea id="supplier-address" rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="supplier-phone">Phone:</label>
                        <input type="tel" id="supplier-phone">
                    </div>
                    <div class="form-group">
                        <label for="supplier-email">Email:</label>
                        <input type="email" id="supplier-email">
                    </div>
                    <div class="form-group">
                        <label for="payer-source">Payer Source:</label>
                        <input type="text" id="payer-source">
                    </div>
                    <div class="form-group">
                        <label for="atp-name">Name of ATP (Required):</label>
                        <input type="text" id="atp-name" required>
                    </div>
                </div>
                <div style="flex: 1;">
                    <h4>Ship To:</h4>
                    <div class="form-group">
                        <label for="ship-to-name">Name:</label>
                        <input type="text" id="ship-to-name">
                    </div>
                    <div class="form-group">
                        <label for="ship-to-address">Address:</label>
                        <textarea id="ship-to-address" rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="ship-to-phone">Phone:</label>
                        <input type="tel" id="ship-to-phone">
                    </div>
                    <div class="form-group">
                        <label for="tag-for">Tag For:</label>
                        <input type="text" id="tag-for">
                    </div>
                </div>
            </div>
        </div>

        <div v-show="activeTab === 'table'">
            <div v-if="isLoading" class="loading">Loading Table Data...</div>
            <div v-if="error" class="error">{{ error }}</div>
            <div v-if="!isLoading && !error" style="padding-top: 1rem;">
                <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th v-for="header in selectedTableHeaders" :key="header" :class="getColumnClass(header)">{{ header }}</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="(row, index) in tableData" :key="row.ID || index">
                            <td v-for="header in selectedTableHeaders" :key="header" :class="getColumnClass(header)">
                                {{ getDataRow(row, header) }}
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            </div>
        </div>

        <div v-show="activeTab === 'summary'" id="summary-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <div>
                    <h2 style="margin: 0;">{{ currentBuildName || 'Summary' }}</h2>
                    <p v-if="formattedBuildDate" style="margin: 0; font-size: 0.8rem; color: #666;">Last Saved: {{ formattedBuildDate }}</p>
                </div>
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                    <button @click="downloadSummary" class="submit-button" style="margin: 0; display: flex; align-items: center; gap: 0.3rem; padding: 4px 8px; line-height: 1;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/><path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/></svg>
                        CSV
                    </button>
                    <button @click="downloadPdfSummary" class="submit-button" style="margin: 0; display: flex; align-items: center; gap: 0.3rem; padding: 4px 8px; line-height: 1;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/><path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/></svg>
                        PDF
                    </button>
                </div>
            </div>
            <div v-if="finalConfigurationItems.length > 0" class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th v-for="header in selectedSummaryHeaders" :key="header" :style="{ 'text-align': isPriceColumn(header) ? 'right' : 'left' }">
                                {{ header }}
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="item in finalConfigurationItems" :key="item.ID">
                            <td v-for="header in selectedSummaryHeaders" :key="header" :style="{ 'text-align': isPriceColumn(header) ? 'right' : 'left' }">
                                <span v-if="isPriceColumn(header)">{{ currencySymbol }}</span>
                                {{ getSummaryData(item, header) }}
                            </td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <td v-for="header in selectedSummaryHeaders" :key="header" :style="{ 'text-align': header === 'Description' || isPriceColumn(header) ? 'right' : 'left', 'font-weight': 'bold' }">
                                <span v-if="header === 'Description'">Subtotal:</span>
                                <span v-if="isPriceColumn(header)">{{ currencySymbol }}{{ getHeaderTotal(header) }}</span>
                            </td>
                        </tr>
                        <!-- Dynamically added summary adjustments -->
                        <tr v-for="item in summaryAdjustments" :key="item.label">
                            <td v-for="(header, index) in selectedSummaryHeaders" :key="header" :style="{ 'text-align': isPriceColumn(header) ? 'right' : 'left', 'font-weight': 'normal' }">
                                <span v-if="index === descriptionColumnIndex">{{ item.label }}</span>
                                <span v-if="isPriceColumn(header) && header !== 'Cost'">{{ formatAdjustment(item, header) }}</span>
                            </td>
                        </tr>
                        <!-- Final Total Row -->
                        <tr v-if="summaryAdjustments.length > 0">
                            <td v-for="(header, index) in selectedSummaryHeaders" :key="header" :style="{ 'text-align': isPriceColumn(header) ? 'right' : 'left', 'font-weight': 'bold', 'border-top': '2px solid black' }">
                                <span v-if="index === descriptionColumnIndex" :style="{ color: 'var(--color-dark-blue)' }">Total:</span>
                                <span v-if="isPriceColumn(header) && header !== 'Cost'">{{ currencySymbol }}{{ getGrandTotal(header) }}</span>
                            </td>
                        </tr>
                    </tfoot>
                </table>
            </div>
            <p v-else>No items have been configured yet.</p>
        </div>

        <div v-if="isLoggedIn" v-show="activeTab === 'my-builds'">
            <h2>My Saved Builds</h2>
            <div v-if="savedBuilds.length > 0" class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Product</th>
                            <th>Last Saved</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="build in savedBuilds" :key="build.id">
                            <td>
                                <a href="#" @click.prevent="promptAndRenameBuild(build)">{{ build.configurationName }}</a>
                            </td>
                            <td>{{ build.productName }}</td>
                            <td>{{ new Date(build.updatedAt.seconds * 1000).toLocaleString() }}</td>
                            <td>
                                <button @click="loadSavedConfiguration(build)" class="clear-button">Load</button>
                                <button @click="deleteSavedConfiguration(build.id)" class="clear-button" style="color: var(--color-danger);">Delete</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <p v-else>You have no saved builds for this product.</p>
        </div>

        <div v-show="activeTab === 'settings'">
            <h2>Settings</h2>
            
            <div>
                <h4>General</h4>
                <div class="form-group">
                    <label>
                        <input type="checkbox" v-model="isSpecialOrder"> Mark as Special Order
                    </label>
                </div>
            </div>
            <hr>
            <div>
                <h4>Build</h4>
                <!-- Settings for the Build tab will go here -->
                <div class="form-group" style="margin-bottom: 1rem; padding-top: 1px; padding-bottom: 1px;">
                    <label>Select Price Schedules to Display:</label>
                    <div class="custom-multiselect" ref="priceColumnSelector">
                        <div class="multiselect-display" @click="togglePriceScheduleDropdown">
                            <div v-if="selectedPriceHeaders.length === 0" style="padding: 5px 0;">Select Price Columns</div>
                            <div v-else class="selected-items-container">
                                <span v-for="(header, index) in selectedPriceHeaders"
                                      :key="header"
                                      class="selected-item-tag"
                                      draggable="true"
                                      @dragstart="dragStart(index, $event)"
                                      @dragover.prevent="dragOver(index, $event)"
                                      @dragleave="dragLeave($event)"
                                      @drop="onDrop(index, $event)">
                                    {{ header }}
                                </span>
                            </div>
                        </div>
                        <div class="multiselect-options" v-if="isPriceScheduleDropdownOpen">
                            <label v-for="header in priceColumnHeaders" :key="header" style="display: block; padding: 5px 10px;">
                                <input type="checkbox" :value="header" v-model="selectedPriceHeaders"> {{ header }}
                            </label>
                        </div>
                    </div>
                </div>
                <hr style="margin: 1.5rem 0;">
                <!-- Prices Subsection -->
                <h5>Prices</h5>
                <div class="form-group" style="display: flex; gap: 0.5rem; align-items: flex-end;">
                    <div>
                        <label for="discount-source">Price Schedule</label>
                        <select id="discount-source" v-model="secondaryDiscountSource" style="margin-bottom: 0; width: 16ch;">
                            <option disabled value="">Select Price Schedule</option>
                            <option v-for="header in priceColumnHeaders" :key="header" :value="header">{{ header }}</option>
                        </select>
                    </div>
                    <div style="display: flex; flex-direction: column; align-items: center; text-align: center;">
                        <label style="margin-bottom: 0.2rem; width: 100%;">Discounts</label>
                        <div style="display: flex; align-items: flex-end; gap: 0.2rem;">
                            <div style="display: flex; flex-direction: column; align-items: center;">
                                <label for="base-discount" style="font-size: 0.8em;">Primary</label>
                                <input type="number" id="base-discount" v-model.number="baseDiscount" placeholder="%" style="width: 5ch; margin-bottom: 0;">
                            </div>
                            <span style="font-size: 1.5rem; padding-bottom: 0.1rem;">+</span>
                            <div style="display: flex; flex-direction: column; align-items: center;">
                                <label for="secondary-discount" style="font-size: 0.8em;">Secondary</label>
                                <input type="number" id="secondary-discount" v-model.number="secondaryDiscount" placeholder="%" style="width: 5ch; margin-bottom: 0;">
                            </div>
                        </div>
                    </div>
                    <div style="display: flex; flex-direction: column; align-items: center;">
                        <label for="markup" style="font-size: 0.8em; margin-bottom: 0.2rem;">Markup</label>
                        <input type="number" id="markup" v-model.number="markup" placeholder="%" style="width: 5ch; margin-bottom: 0;">
                    </div>
                    <div style="display: flex; flex-direction: column; align-items: center;">
                        <label style="margin-bottom: 0.2rem;">FX-Currency</label>
                        <div style="display: flex; align-items: flex-end; gap: 0.2rem;">
                            <input type="number" id="fx" v-model.number="fx" placeholder="Rate" style="width: 5ch; margin-bottom: 0;" title="FX Rate">
                            <input type="text" id="currency-symbol" v-model="currencySymbol" list="currency-list" maxlength="3" style="width: 6ch; margin-bottom: 0; text-align: center;" title="Currency Symbol">
                        </div>
                    </div>
                    <div style="display: flex; align-items: flex-end; gap: 0.5rem;">
                        <div>
                            <label for="secondary-discount-name">Price Schedule Name</label>
                            <input type="text" id="secondary-discount-name" v-model="secondaryDiscountName" style="margin-bottom: 0; width: 16ch;">
                        </div>
                        <button @click.prevent="createPriceSchedule" type="button" title="Create Price Schedule" style="margin-bottom: 0; padding: 5px; line-height: 1; height: 37px; width: 37px;" :style="{ color: 'var(--color-bright-blue)' }">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg></button>
                    </div>
                </div>
                <datalist id="currency-list">
                    <option value=""></option>
                    <option value="$">USD</option>
                    <option value="€">EUR</option>
                    <option value="£">GBP</option>
                    <option value="¥">JPY</option>
                    <option value="C$">CAD</option>
                    <option value="A$">AUD</option>
                    <option value="Fr">CHF</option>
                    <option value="₹">INR</option>
                    <option value="R$">BRL</option>
                    <option value="₽">RUB</option>
                    <option value="₩">KRW</option>
                    <option value="Mex$">MXN</option>
                    <option value="S$">SGD</option>
                    <option value="NZ$">NZD</option>
                    <option value="kr">SEK</option>
                    <option value="zł">PLN</option>
                    <option value="฿">THB</option>
                    <option value="₺">TRY</option>
                </datalist>
                <!-- Saved Profiles Subsection -->
                <div v-if="savedDiscountProfiles.length > 0">
                    <div class="form-group" style="margin-top: 1.5rem; border-top: 1px solid #ccc; padding-top: 1rem;">
                        <label>Manage Saved Price Schedules</label>
                        <div style="display: flex; align-items: flex-end; gap: 0.5rem;">
                            <select v-model="profileToManageId" style="margin-bottom: 0;">
                                <option disabled value="">Select Schedule</option>
                                <option v-for="profile in savedDiscountProfiles" :key="profile.id" :value="profile.id">{{ profile.discountName }}</option>
                            </select>
                            <button @click.prevent="renamePriceSchedule" type="button" style="margin-bottom: 0;">Rename</button>
                            <button @click.prevent="deletePriceSchedule" type="button" style="margin-bottom: 0; color: var(--color-danger);">Delete</button>
                        </div>
                    </div>
                </div>
                <hr style="margin: 1.5rem 0;">
                 <!-- Cost Subsection - Visible only to admins -->
                <div>
                    <h5>Cost</h5>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" v-model="showCosts"> Show Costs
                        </label>
                    </div>
                    <div class="form-group">
                        <div style="display: flex; align-items: flex-end; gap: 0.5rem;">
                            <div style="display: flex; flex-direction: column; align-items: center;">
                                <label for="overhead-costs" style="font-size: 0.8em;">Unit Overhead</label>
                                <input type="number" id="overhead-costs" v-model.number="overheadCosts" placeholder="Cost" style="width: 6ch; margin-bottom: 0;">
                            </div>
                            <div style="display: flex; flex-direction: column; align-items: center;">
                                <label for="shipping" style="font-size: 0.8em;">Shipping</label>
                                <input type="number" id="shipping" v-model.number="shipping" placeholder="Cost" style="width: 6ch; margin-bottom: 0;">
                            </div>
                            <div style="display: flex; flex-direction: column; align-items: center;">
                                <label for="duties" style="font-size: 0.8em;">Duty/Tax %</label>
                                <input type="number" id="duties" v-model.number="duties" placeholder="Duty/Tax %" style="width: 8ch; margin-bottom: 0;" title="Duty/Tax %">
                            </div>
                            <div style="display: flex; flex-direction: column; align-items: center;">
                                <label for="tax" style="font-size: 0.8em;">VAT %</label>
                                <input type="number" id="tax" v-model.number="tax" placeholder="VAT %" style="width: 6ch; margin-bottom: 0;" title="VAT %">
                            </div>
                            <div style="display: flex; flex-direction: column; align-items: center;">
                                <label for="delivery" style="font-size: 0.8em;">Delivery</label>
                                <input type="number" id="delivery" v-model.number="delivery" placeholder="Cost" style="width: 6ch; margin-bottom: 0;">
                            </div>
                        </div>
                    </div>
                <div class="form-group">
                        <label for="cost-basis-source">Cost Basis for Margin</label>
                        <select id="cost-basis-source" v-model="costBasisSource">
                            <option v-for="header in priceColumnHeaders" :key="header" :value="header">
                                {{ header }}
                            </option>
                        </select>
                    </div>
                </div>
            </div>
            <hr>
            <div>
                <h4>Order Details</h4>
                <!-- Settings for the Order Details tab will go here -->
            </div>
            <hr>
            <div>
                <h4>Item List</h4>
                <div class="form-group" style="margin-bottom: 1rem; padding-top: 1px; padding-bottom: 1px;">
                    <label>Select Table Columns to Display:</label>
                    <div class="custom-multiselect" ref="columnSelector">
                        <div class="multiselect-display" @click="toggleColumnDropdown">
                            {{ selectedTableHeaders.length > 0 ? selectedTableHeaders.length + ' columns selected' : 'Columns Select' }}
                        </div>
                        <div class="multiselect-options" v-if="isColumnDropdownOpen">
                            <label v-for="header in itemListColumnOptions" :key="header" style="display: block; padding: 5px 10px;">
                                <input type="checkbox" :value="header" v-model="selectedTableHeaders"> {{ header }}
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            <hr>
            <div>
                <h4>Summary</h4>
                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <div class="form-group" style="margin-bottom: 1rem; padding-top: 1px; padding-bottom: 1px;">
                        <label>Select Summary Columns to Display:</label>
                        <div class="custom-multiselect" ref="summaryColumnSelector">
                            <div class="multiselect-display" @click="toggleSummaryColumnDropdown">
                                {{ selectedSummaryHeaders.length > 0 ? selectedSummaryHeaders.length + ' columns selected' : 'Select Columns' }}
                            </div>
                            <div class="multiselect-options" v-if="isSummaryColumnDropdownOpen">
                                <label v-for="header in summaryTableHeaders" :key="header" style="display: block; padding: 5px 10px;">
                                    <input type="checkbox" :value="header" v-model="selectedSummaryHeaders"> {{ header }}
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Summary Adjustments</label>
                        <div style="display: flex; align-items: flex-end; gap: 0.5rem;">
                            <div style="display: flex; flex-direction: column; align-items: center;">
                                <label for="summary-discount" style="font-size: 0.8em;">Discount %</label>
                                <input type="number" id="summary-discount" v-model.number="summaryDiscount" placeholder="%" style="width: 8ch; margin-bottom: 0;">
                            </div>
                            <div style="display: flex; flex-direction: column; align-items: center;">
                                <label for="summary-setup-delivery" style="font-size: 0.8em;">Setup/Delivery</label>
                                <input type="number" id="summary-setup-delivery" v-model.number="summarySetupDelivery" placeholder="Amount" style="width: 8ch; margin-bottom: 0;">
                            </div>
                            <div style="display: flex; flex-direction: column; align-items: center;">
                                <label for="summary-shipping" style="font-size: 0.8em;">Shipping</label>
                                <input type="number" id="summary-shipping" v-model.number="summaryShipping" placeholder="Amount" style="width: 8ch; margin-bottom: 0;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </script>

    <script type="module">
        import { initializeConfigurator } from './sc-logic.js?v=2';

        // We must wait for the DOM to be fully loaded before initializing the Vue app.
        // This ensures that the template defined in the <script type="text/x-template"> tag
        // is available before Vue tries to use it.
        document.addEventListener('DOMContentLoaded', () => {
            initializeConfigurator({
                productName: 'Shower Commode',
                firestoreDocId: 'sc',
                priceFields: ['MSRP 26', 'MSRP 25', 'Off Unit'],
                baseSection: 'Frame' // The 'Base' products are in the 'Frame' section for this sheet
            });
        });
    </script>

</body>

</html>
