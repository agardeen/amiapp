<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Configurators</title>
    <!-- A simple, clean CSS framework for styling -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            margin: 0;
        }
        .container { 
            max-width: 600px; 
            margin: 2rem auto; 
            padding: 2rem; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            background-color: #f9f9f9; 
            text-align: center;
        }
        ul { list-style-type: none; padding: 0; }
        li { margin: 1.5rem 0; }
        a { font-size: 1.25rem; text-decoration: none; }
        a:hover { color: #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Product Configurators</h2>
        <p>Please select a product to begin configuration.</p>
        <ul id="product-links">
            <!-- Links will be dynamically inserted here by JavaScript -->
        </ul>
    </div>

    <script>
        // To add a new page link, add a new entry to this 'pages' array.
        const pages = [
            { href: 'z1of.html', text: 'Zing Size 1' },
            { href: 'z2of.html', text: 'Zing Size 2' },
            { href: 'SC.html', text: 'Shower Commode (Multi-Price)' },
            { href: 'SCof.html', text: 'Shower Commode (MSRP 25)' },
            { href: 'SCof26.html', text: 'Shower Commode (MSRP 26)' }
        ];

        const productLinksList = document.getElementById('product-links');

        pages.forEach(page => {
            const listItem = document.createElement('li');
            const link = document.createElement('a');
            link.href = page.href;
            link.textContent = page.text;
            listItem.appendChild(link);
            productLinksList.appendChild(listItem);
        });
    </script>
    <!-- Test comment for VS Code task -->
</body>
</html>
