<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Product Configurators</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .container {
            max-width: 400px;
            padding: 2rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        .error-message {
            color: red;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" title="Home" style="color: var(--text-main);">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8h5z"/></svg>
        </a>
        <h2>Login</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <button type="button" id="login-button">Login</button>
                <button type="button" id="signup-button">Sign Up</button>
            </div>
            <a href="#" id="forgot-password-link" style="display: block; text-align: center; margin-top: 1rem; font-size: 0.9rem;">Forgot Password?</a>
        </form>
        <p id="error-message" class="error-message"></p>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script>
        // IMPORTANT: Paste your Firebase config object here
        const firebaseConfig = {
          apiKey: "AIzaSyAnmxoSyCss3WqD6vjotAcoVJYEiXMhtHk",
          authDomain: "amiapp-e1d48.firebaseapp.com",
          projectId: "amiapp-e1d48",
          storageBucket: "amiapp-e1d48.appspot.com",
          messagingSenderId: "709156310854",
          appId: "1:709156310854:web:464a879038815ede871f47",
          measurementId: "G-TKSX1GEVSS"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginButton = document.getElementById('login-button');
        const signupButton = document.getElementById('signup-button');
        const forgotPasswordLink = document.getElementById('forgot-password-link');
        const errorMessage = document.getElementById('error-message');

        // Get the redirect URL from the query parameter, or default to index.html
        const urlParams = new URLSearchParams(window.location.search);
        const redirectUrl = urlParams.get('redirect') || 'index.html';

        // Redirect if already logged in
        auth.onAuthStateChanged(user => {
            if (user) {
                window.location.href = redirectUrl;
            }
        });

        loginButton.addEventListener('click', () => {
            const email = emailInput.value;
            const password = passwordInput.value;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // Signed in
                    window.location.href = redirectUrl;
                })
                .catch((error) => {
                    errorMessage.textContent = error.message;
                });
        });

        signupButton.addEventListener('click', () => {
            const email = emailInput.value;
            const password = passwordInput.value;

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // Signed up and signed in
                    window.location.href = redirectUrl;
                })
                .catch((error) => {
                    errorMessage.textContent = error.message;
                });
        });

        forgotPasswordLink.addEventListener('click', (e) => {
            e.preventDefault();
            const email = emailInput.value;
            if (!email) {
                errorMessage.textContent = 'Please enter your email address above to reset your password.';
                return;
            }

            auth.sendPasswordResetEmail(email)
                .then(() => {
                    errorMessage.textContent = ''; // Clear any previous errors
                    alert(`A password reset link has been sent to ${email}. Please check your inbox.`);
                })
                .catch((error) => {
                    errorMessage.textContent = error.message;
                });
        });
    </script>
</body>
</html>
